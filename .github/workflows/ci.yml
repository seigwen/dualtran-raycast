name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Unit + integration tests (jest)
        run: npm test
      - name: Build (ray build)
        run: npm run build
      - name: Lint (ray lint)
        # Tolerance note: `ray lint` validates the author against the LIVE
        # Raycast user API. The handle is set at publish time (plan 63 D6);
        # flip continue-on-error off right after the account exists.
        continue-on-error: true
        run: npm run lint
